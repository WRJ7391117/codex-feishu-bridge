name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify tag and App version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Run test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install Developer ID and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$CODE_SIGN_IDENTITY"
          test -n "$APPLE_NOTARY_KEY_P8_BASE64"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          release_keychain="$RUNNER_TEMP/codex-feishu-release.keychain-db"
          certificate_path="$RUNNER_TEMP/codex-feishu-release.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "RELEASE_KEYCHAIN=$release_keychain" >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | \
            /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | \
            /usr/bin/base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"
          security create-keychain -p "$keychain_password" "$release_keychain"
          security set-keychain-settings -lut 21600 "$release_keychain"
          security unlock-keychain -p "$keychain_password" "$release_keychain"
          security import "$certificate_path" \
            -k "$release_keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$release_keychain" >/dev/null
          security list-keychains -d user -s "$release_keychain"
          security default-keychain -d user -s "$release_keychain"
          notary_profile="codex-feishu-release"
          xcrun notarytool store-credentials "$notary_profile" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$release_keychain"
          security find-identity -v -p codesigning "$release_keychain" | \
            grep -F "$CODE_SIGN_IDENTITY"
          xcrun notarytool history \
            --keychain-profile "$notary_profile" \
            --keychain "$release_keychain" >/dev/null
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=$notary_profile" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$release_keychain" >> "$GITHUB_ENV"
      - name: Build Universal package
        run: ./scripts/build-app.sh
      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            ./scripts/generate-appcast.sh "$GITHUB_REF_NAME"
      - name: Verify package
        run: |
          app="build/Codex 飞书桥接.app"
          codesign --verify --deep --strict "$app"
          spctl -a -t exec -vv "$app"
          xcrun stapler validate "$app"
          lipo "$app/Contents/MacOS/CodexFeishuBridge" -verify_arch arm64 x86_64
          lipo "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" \
            -verify_arch arm64 x86_64
          otool -L "$app/Contents/MacOS/CodexFeishuBridge" | \
            grep -F '@rpath/Sparkle.framework/Versions/B/Sparkle'
          otool -l "$app/Contents/MacOS/CodexFeishuBridge" | \
            grep -F '@executable_path/../Frameworks'
          (cd dist && shasum -a 256 -c Codex-Feishu-Bridge-macOS-universal.zip.sha256)
          xmllint --noout dist/appcast.xml
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/Codex-Feishu-Bridge-macOS-universal.zip
            dist/Codex-Feishu-Bridge-macOS-universal.zip.sha256
            dist/update.json
            dist/appcast.xml
          )
          title="DeepOri Bridge ${GITHUB_REF_NAME#v} for macOS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace signed assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --draft \
            --title "$title" \
            --notes-file RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" && -f "$RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/codex-feishu-release.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8 || true
