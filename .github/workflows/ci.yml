name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check shell scripts
        run: |
          for script in scripts/*.sh Resources/bridge/*.sh; do
            /bin/zsh -n "$script"
          done
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Type-check macOS App
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc -typecheck -target arm64-apple-macos13.0 -sdk "$sdk" Sources/CodexFeishuBridgeApp/main.swift
      - name: Build Universal App
        run: ./scripts/build-app.sh
      - name: Verify package
        run: |
          app="build/Codex 飞书桥接.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/CodexFeishuBridge" -verify_arch arm64 x86_64
          (cd dist && shasum -a 256 -c Codex-Feishu-Bridge-macOS-universal.zip.sha256)
